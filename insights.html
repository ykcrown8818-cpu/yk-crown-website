* {

html {

body {

    background: #f5f3ee;

}

header {
    background: #ffffff;

    justify-content: space-between;

}

.logo {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 3px;
}

.logo span {
    color: #b99a57;

nav a {
    margin-left: 25px;

}

.hero {
    background: #ffffff;

.eyebrow {

}

    margin: 22px 0;
}

.lead {
    max-width: 780px;
    color: #68727c;
    font-size: 21px;
    line-height: 1.7;
}

.notes {
    max-width: 1250px;
    margin: auto;
    padding: 70px 6%;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 30px;
}

.card {
    background: #ffffff;
    border: 1px solid #dedbd3;
}

.card img {
    width: 100%;
    display: block;
    aspect-ratio: 16 / 10;

}

.card-content {
    padding: 28px;
}

.card-number {
    color: #b99a57;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
}

.card h2 {
    font-size: 29px;
    margin: 12px 0;
}

.card p {
    color: #68727c;
    line-height: 1.65;
}

.card a {
    color: #14202d;
    text-decoration: none;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
}

.article {
    background: #ffffff;
    padding: 90px 7%;
    border-top: 1px solid #dedbd3;
}

.article-inner {
    max-width: 850px;
    margin: auto;
}

.article h2 {
    font-size: 52px;
    line-height: 1.05;
    margin: 15px 0 35px;
}

.article p {
    color: #4e5862;
    font-size: 18px;
    line-height: 1.85;
}

.quote {
    border-left: 3px solid #b99a57;
    padding-left: 22px;
    margin: 40px 0;
    font-size: 28px;
    line-height: 1.45;
    color: #14202d;
}

footer {
    background: #14202d;
    color: #dce2e7;
    padding: 40px 7%;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
}

@media (max-width: 760px) {

    header {
        padding: 18px 5%;
    }

    nav a {
        margin-left: 10px;
        font-size: 9px;
    }

    .hero {
        padding: 65px 6%;
    }

    .notes {
        grid-template-columns: 1fr;
        padding: 45px 5%;
    }

    .article {
        padding: 60px 6%;
    }

    .article h2 {
        font-size: 39px;
    }

    .article p {
        font-size: 16px;
    }

    footer {
        display: block;
    }
}
</style>
