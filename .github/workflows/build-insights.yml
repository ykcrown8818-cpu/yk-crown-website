name: Build Insights
# Every 30 minutes: download articles the editor approved (Supabase view published_articles),
# rebuild the Insights pages, insights.html and sitemap.xml, and commit if anything changed.
# Cloudflare deploys the commit automatically. Needs repo secret SUPABASE_KEY (publishable key).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/build_insights.py", "tools/fetch_insights.py"]
permissions:
  contents: write
concurrency:
  group: build-insights
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch published articles
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 tools/fetch_insights.py
      - run: python3 tools/build_units.py
      - name: Commit generated pages
        run: |
          git config user.name "yk-insights-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A content/insights insights insights.html sitemap.xml
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Publish Insights articles"
          git pull --rebase origin main
          git push origin HEAD:main
